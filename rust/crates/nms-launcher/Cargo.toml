[package]
name = "nms-launcher"
description = "Install the Rust loader and talk to it while the game runs. The egui window is phase B4."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nms-rs"
path = "src/main.rs"

[dependencies]
nms-amumss.workspace = true
nms-core.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq.workspace = true
zip.workspace = true
egui.workspace = true
egui_software_backend.workspace = true
skrifa.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
